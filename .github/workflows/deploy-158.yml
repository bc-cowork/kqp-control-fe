name: Deploy to 158 server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-158
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create zip of repo contents
        run: |
          zip -r kqp-control-fe.zip . -x ".git/*" -x ".github/*"

      - name: Copy zip to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "kqp-control-fe.zip"
          target: "/home/user02/kuanta-offline-install/"
          overwrite: true

      - name: Build and restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd /home/user02/kuanta-offline-install
            # -d puts repo contents inside kqp-control-fe/ (zip has no top-level folder)
            unzip -o kqp-control-fe.zip -d kqp-control-fe
            ./ci-build.sh
            # ci-start.sh ends with `sudo pm2 startup`, one-time root setup that cannot
            # prompt for a password over non-interactive SSH. That is not part of a
            # deploy, so it must not fail the deploy - the health check below is what
            # decides success.
            ./ci-start.sh || echo "ci-start.sh exited non-zero (likely the sudo pm2 startup step); verifying app health instead"

            PORT="$(grep -E "^PORT=" kqp-control-fe/.env | tail -n1 | cut -d= -f2)"
            PORT="${PORT:-8083}"
            for i in $(seq 1 15); do
              code="$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:$PORT/" || true)"
              if [ "$code" = "200" ]; then
                echo "app healthy on port $PORT (HTTP 200)"
                exit 0
              fi
              sleep 2
            done
            echo "ERROR: app did not return HTTP 200 on port $PORT after 30s"
            pm2 logs kuanta-frontend --lines 50 --nostream || true
            exit 1
